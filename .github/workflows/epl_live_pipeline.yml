name: EPL 2026/27 Live Predictive Pipeline

on:
  schedule:
    - cron: '0 20 * * 4' # Thursday at 20:00 UTC (Pre-match predictions)
    - cron: '0 10 * * 1' # Monday at 10:00 UTC (Post-match state updates)
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to trigger manually'
        required: true
        default: 'predict'
        type: choice
        options:
          - predict
          - update
          - both

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      API_FOOTBALL_SEASON: '2026'
      API_FOOTBALL_LEAGUE_ID: '39'
      LIVE_DB_PATH: 'data/live/epl_2627.db'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Thursday Prediction Pipeline
        if: |
          github.event.schedule == '0 20 * * 4' || 
          (github.event_name == 'workflow_dispatch' && (inputs.action == 'predict' || inputs.action == 'both'))
        run: |
          python scripts/predict_next_gameweek.py --auto

      - name: Run Monday Update Pipeline
        if: |
          github.event.schedule == '0 10 * * 1' || 
          (github.event_name == 'workflow_dispatch' && (inputs.action == 'update' || inputs.action == 'both'))
        run: |
          python scripts/update_live_state.py

      - name: Commit and Push Database Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update 2026/27 predictions and live states"
          file_pattern: "data/live/epl_2627.db"
