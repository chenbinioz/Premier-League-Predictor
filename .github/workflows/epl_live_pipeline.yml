name: EPL 2026/27 Live Predictive Pipeline

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to trigger manually'
        required: true
        default: 'both'
        type: choice
        options:
          - update
          - predict
          - both

concurrency:
  group: epl-live-database-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate-repair:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Verify pipeline invariants
        run: python -m unittest discover -s tests -v
      - name: Verify deployed model and database bundle
        run: python scripts/audit_project.py --strict

  run-pipeline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UNDERSTAT_SEASON: '2026'
      UNDERSTAT_LEAGUE: 'EPL'
      LIVE_DB_PATH: 'data/live/epl_2627.db'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify pipeline invariants
        run: python -m unittest discover -s tests -v

      - name: Run Live State & Fixture Update Pipeline
        if: |
          github.event_name == 'schedule' || 
          (github.event_name == 'workflow_dispatch' && (inputs.action == 'update' || inputs.action == 'both'))
        run: |
          python scripts/update_live_state.py

      - name: Audit updated results before publication
        if: github.event_name == 'schedule' || inputs.action == 'update' || inputs.action == 'both'
        run: python scripts/audit_project.py --strict --output reports/latest_audit.json

      - name: Publish validated results before prediction
        if: github.event_name == 'schedule' || inputs.action == 'update' || inputs.action == 'both'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: reconcile validated 2026/27 results and team states"
          file_pattern: "data/live/epl_2627.db reports/latest_audit.json"

      - name: Run Pre-Match Prediction Pipeline
        if: |
          github.event_name == 'schedule' || 
          (github.event_name == 'workflow_dispatch' && (inputs.action == 'predict' || inputs.action == 'both'))
        run: |
          python scripts/predict_next_gameweek.py --auto

      - name: Audit reconciled data and predictions
        run: python scripts/audit_project.py --strict --output reports/latest_audit.json

      - name: Commit and Push Database Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: daily update of 2026/27 fixture results, live states, and predictions"
          file_pattern: "data/live/epl_2627.db reports/latest_audit.json"

      - name: Record data freshness in run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/latest_audit.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if path.exists():
                  report = json.loads(path.read_text())
                  summary.write('Audit snapshot (check timestamp; an earlier step may have failed):\n\n')
                  for key in ('audited_at', 'passed', 'completed', 'pending', 'overdue', 'locked_forecasts'):
                      summary.write(f'- {key}: {report.get(key)}\n')
              else:
                  summary.write('No audit snapshot available. Inspect failed steps.\n')
          PY

      - name: Preserve audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pipeline-audit
          path: reports/latest_audit.json

