name: Weekly Premier League Data & Model Update

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Maintenance Pipeline
        run: |
          python maintenance.py

      - name: Commit and Push Updated Data & Models
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update weekly match results, rolling features, and models"
          file_pattern: "data/raw/* data/processed/* models/*"
